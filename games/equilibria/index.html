<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Equilibria · Albert Carlson</title>
  <script src="../../theme.js"></script>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    body { height: 100vh; height: 100dvh; min-height: 0; display: flex; flex-direction: column; }
    .viewer { flex: 1; min-height: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
    .viewer img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .controls { display: flex; align-items: center; gap: 8px; padding: 6px max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); border-top: 1px solid var(--gray); }
    button, .back { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; min-width: 44px; min-height: 44px; border: 1px solid var(--gray); border-radius: 8px; background: var(--white); color: var(--black); text-decoration: none; cursor: pointer; touch-action: manipulation; }
    button { font: inherit; font-size: 24px; }
    button:hover, .back:hover { background: var(--blue-light); }
    button:disabled { opacity: .3; cursor: default; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .caption { flex: 1; min-width: 0; text-align: center; line-height: 1.3; }
    #filename { display: block; overflow-wrap: anywhere; font-size: 14px; }
    #counter { display: block; color: var(--gray-text); font-size: 12px; }
  </style>
</head>
<body>
  <main class="viewer" aria-label="Equilibria image viewer">
    <img id="image" src="images/04.0_new.png" alt="Equilibria: 04.0_new.png">
  </main>
  <footer class="controls" aria-label="Image navigation">
    <a class="back" href="../../minigames.html" aria-label="Back to games" title="Back to games">⌂</a>
    <button id="previous" type="button" aria-label="Previous image" title="Previous image (left arrow)" disabled>←</button>
    <div class="caption" role="status" aria-live="polite" aria-atomic="true">
      <span id="filename">04.0_new.png</span>
      <span id="counter">1 / 15</span>
    </div>
    <button id="next" type="button" aria-label="Next image" title="Next image (right arrow)">→</button>
    <button id="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">◐</button>
  </footer>
  <noscript>Enable JavaScript to browse all images.</noscript>
  <script>
    // Static hosting cannot list a directory. Add new PNG filenames here.
    const images = [
      '04.0_new.png', '05.0_new.png',
      '05.5_new.png', '06.0_new.png', '06.5_new.png', '07.0_new.png',
      '07.5_new.png', '08.0_new.png', '09.0_new.png',
      '10.0_new.png', '11.0_new.png', '12.0_new.png', '15.0_new.png',
      '20.0_new.png', '25.0_new.png', 
    ].sort((a, b) => a.localeCompare(b, 'en', { numeric: false }));
    const image = document.getElementById('image');
    const filename = document.getElementById('filename');
    const counter = document.getElementById('counter');
    const previous = document.getElementById('previous');
    const next = document.getElementById('next');
    let index = 0;
    function show(position) {
      index = Math.max(0, Math.min(images.length - 1, position));
      image.src = 'images/' + encodeURIComponent(images[index]);
      image.alt = 'Equilibria: ' + images[index];
      filename.textContent = images[index];
      counter.textContent = `${index + 1} / ${images.length}`;
      previous.disabled = index === 0;
      next.disabled = index === images.length - 1;
    }
    previous.addEventListener('click', () => show(index - 1));
    next.addEventListener('click', () => show(index + 1));
    document.addEventListener('keydown', event => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        show(index + (event.key === 'ArrowLeft' ? -1 : 1));
      }
    });
    image.addEventListener('error', () => { counter.textContent = 'Could not load image. Use the arrows to continue.'; });
    show(0);
  </script>
</body>
</html>
